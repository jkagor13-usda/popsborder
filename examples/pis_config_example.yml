# Configuration for PIS Data Consignment Generation
# This example shows how to use Plant Inspection System (PIS) data
# where consignments are identified by INSPECTION_NUMBER and may contain
# multiple inspection units with different material types.

config:
  consignment:
    # Use "RBS" generation method for record-based data with "PIS" file type
    generation_method: "RBS"
    
    # Input file configuration for PIS data
    input_file:
      file_type: "PIS"  # Plant Inspection System data under RBS method
      file_name: "hierarchal sampling/data/fake_pis_data.csv"
    
    # PIS generator is fully data-driven - no configuration parameters needed!
    # sample_units_per_inspection_unit and plants_per_sample_unit are calculated
    # directly from TOTAL_SAMPLING_UNITS and TOTAL_PLANT_QUANTITY columns
        
    # Start date (not used for PIS data, dates come from records if available)
    start_date: "2020-01-01"

# Other configuration sections can be added as needed for contamination, 
# inspections, etc.
contamination:
  # Contamination configuration would go here
  pass

inspections:
  # Inspection configuration would go here  
  pass

simulation:
  # Simulation configuration would go here
  pass