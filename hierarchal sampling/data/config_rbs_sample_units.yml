# Configuration for TRUE sample-unit-level RBS inspection
# This fixes the issue where RBS opens all boxes instead of inspecting calculated sample units

consignments:
  num_consignments: 10000
  ports_of_entry:
    domestic:
      - Anchorage PIS
      - Atlanta PIS
      - Baltimore PIS
      - Boston PIS
      - Buffalo PIS
      - Charleston PIS
      - Chicago PIS
      - Cleveland PIS
      - Dallas PIS
      - Denver PIS
      - Detroit PIS
      - El Paso PIS
      - Laredo PIS
      - Long Beach PIS
      - Louisville PIS
      - Memphis PIS
      - Minneapolis PIS
      - New Orleans PIS
      - New York PIS
      - Newark PIS
      - Norfolk PIS
      - Otay Mesa PIS
      - Philadelphia PIS
      - Phoenix PIS
      - Portland PIS
      - Providence PIS
      - Savannah PIS
      - St. Paul PIS
      - Tampa PIS
      - Wilmington PIS
    unincorporated:
      - Guam PIS
      - Honolulu PIS
      - Houston PIS
      - JFK PIS
      - Linden PIS
      - Los Angeles PIS
      - Los Indios PIS
      - Miami PIS
      - Nogales PIS
      - Orlando PIS
      - San Diego PIS
      - San Francisco PIS
      - Seattle PIS
  input_file:
    file_type: PIS
    file_name: hierarchal sampling/data/fake_pis_data.csv

contamination:
  contamination_unit: sample_unit
  contamination_rate:
    distribution: beta
    value: 0.0027
    parameters:
      - 0.0194628
      - 2.7609372
  arrangement: random
  clustered:
    percentage_plants_contaminated: .9
    contaminated_units_per_cluster: 200
    distribution: random
    random:
      cluster_item_width: 200
  random_box:
    probability: 0.2
    ratio: 0.5

inspection:
  unit: sample_units                    # Inspect at sample unit level
  sample_strategy: rbs                  # Use RBS
  selection_strategy: random            # How to select units (NOT cluster)
  within_box_proportion: 1              # When box opened, inspect all sample units in it
  tolerance_level: 0.005
  min_boxes: 0
  # Note: proportion.value is ignored by RBS - it uses hypergeometric calculation
  proportion:
    value: 0.02                         # This is ignored by RBS!
  hypergeometric:
    detection_level: 0.01               # RBS uses this for calculation
    confidence_level: 0.80              # RBS uses this for calculation
  effectiveness: 0.94